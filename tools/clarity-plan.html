<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Business Systems Assessment | SeamFlow Consulting</title>
<link rel="icon" href="../assets/icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..600&family=Manrope:wght@400..800&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#061B48;
    --navy-soft:#0D2A66;
    --gold:#E6D7A2;
    --gold-light:#F3E9C4;
    --gold-strong:#C9A44A;
    --gold-deep:#8A6A1C;
    --grey:#5B6478;
    --line:rgba(6,27,72,0.13);
    --bg:#FAF6EE;
    --panel:#FFFFFF;
    --danger:#C0392B;
    --warn:#F5A800;
    --ok:#1E8E5A;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:"Manrope","Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:#141B2D;line-height:1.5;}
  .app{max-width:760px;margin:0 auto;padding:0 0 60px;}

  .hdr{background:var(--navy);color:#fff;padding:22px 22px 26px;border-bottom:3px solid var(--gold);}
  .hdr .back{display:inline-block;font-size:12px;color:#C7CFE6;text-decoration:none;margin-bottom:12px;}
  .hdr h1{margin:10px 0 6px;font-family:"Fraunces",Georgia,serif;font-size:26px;font-weight:400;line-height:1.15;letter-spacing:-0.01em;}
  .hdr p{margin:0;font-size:13.5px;color:#C7CFE6;line-height:1.5;}
  .logo-img{display:block;max-width:240px;width:60%;height:auto;margin-left:-4px;}

  .progress-wrap{padding:16px 22px 0;}
  .progress-track{height:6px;background:var(--line);border-radius:4px;overflow:hidden;}
  .progress-fill{height:100%;background:linear-gradient(90deg,var(--gold-strong) 0%, var(--gold) 100%);border-radius:4px;transition:width .3s ease;}
  .progress-label{display:flex;justify-content:space-between;font-size:12px;color:var(--grey);margin-top:6px;font-weight:600;}

  .panel{padding:24px 22px 8px;}
  .domain-tag{display:inline-block;font-size:11px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--navy);background:var(--panel);border:1px solid var(--line);padding:5px 12px;border-radius:999px;margin-bottom:12px;}
  .question{margin-bottom:24px;}
  .q-text{font-family:"Fraunces",Georgia,serif;font-size:20px;color:var(--navy);margin-bottom:16px;line-height:1.3;}
  .scale{display:flex;flex-direction:column;gap:8px;}
  .opt{display:flex;align-items:flex-start;gap:12px;border:1.5px solid var(--line);border-radius:12px;padding:13px 15px;cursor:pointer;background:var(--panel);transition:border-color .15s ease, background .15s ease;}
  .opt:hover{border-color:var(--gold-strong);}
  .opt.selected{border-color:var(--navy);background:#FFFBF0;}
  .opt input{display:none;}
  .opt .dot{width:18px;height:18px;min-width:18px;border-radius:50%;border:2px solid var(--line);margin-top:2px;position:relative;}
  .opt.selected .dot{border-color:var(--navy);}
  .opt.selected .dot::after{content:"";position:absolute;top:3px;left:3px;width:8px;height:8px;border-radius:50%;background:var(--navy);}
  .opt-text{font-size:14px;line-height:1.4;color:#2B3345;}

  .nav-row{display:flex;justify-content:space-between;gap:12px;padding:14px 22px 0;}
  .btn{border:none;border-radius:999px;padding:14px 22px;font-size:14.5px;font-weight:700;cursor:pointer;font-family:inherit;}
  .btn-primary{background:var(--navy);color:#fff;flex:1;}
  .btn-primary:disabled{background:#9AA3BE;cursor:not-allowed;}
  .btn-ghost{background:transparent;color:var(--navy);border:1.5px solid var(--line);}
  .btn-ghost:disabled{opacity:.45;cursor:not-allowed;}
  .btn-gold{background:var(--gold);color:var(--navy);}
  .link-btn{background:none;border:none;color:var(--grey);font-size:13px;text-decoration:underline;cursor:pointer;font-family:inherit;padding:6px;}

  .intro{padding:26px 22px;}
  .intro h2{font-family:"Fraunces",Georgia,serif;font-weight:400;color:var(--navy);font-size:22px;margin:26px 0 10px;}
  .intro h2:first-child{margin-top:0;}
  .intro p{font-size:14px;color:#2B3345;line-height:1.6;margin:0 0 14px;}
  .field-row{display:grid;gap:0 16px;}
  @media (min-width:560px){ .field-row{grid-template-columns:1fr 1fr;} }
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:12.5px;font-weight:700;color:var(--navy);margin-bottom:6px;}
  .field input, .field select{width:100%;padding:12px 13px;border:1.5px solid var(--line);border-radius:10px;font-size:15px;font-family:inherit;background:var(--panel);color:inherit;}

  .cat-label{font-size:11.5px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:var(--gold-deep);margin:22px 0 10px;}
  .assess-card{display:flex;align-items:center;justify-content:space-between;gap:14px;border:1.5px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:10px;background:var(--panel);cursor:pointer;width:100%;text-align:left;font-family:inherit;color:inherit;transition:border-color .15s ease, transform .15s ease;}
  .assess-card:hover{border-color:var(--navy);transform:translateY(-1px);}
  .assess-card h4{margin:0 0 3px;font-family:"Fraunces",Georgia,serif;font-weight:400;color:var(--navy);font-size:18px;line-height:1.25;}
  .assess-card p{margin:0;font-size:12.5px;color:var(--grey);line-height:1.4;}
  .assess-card .go{flex:none;font-size:12.5px;font-weight:800;color:var(--navy);background:var(--gold);border-radius:999px;padding:8px 14px;white-space:nowrap;}
  .assess-card.done .go{background:#E4F3EA;color:var(--ok);}
  .assess-card.featured{background:var(--navy);border-color:var(--navy);}
  .assess-card.featured h4{color:#fff;font-size:21px;}
  .assess-card.featured p{color:#C7CFE6;}

  .results{padding:8px 22px 10px;}
  .gauge-wrap{display:flex;flex-direction:column;align-items:center;padding:20px 0 6px;}
  .gauge-score{font-family:"Fraunces",Georgia,serif;font-size:64px;font-weight:300;color:var(--navy);line-height:1;letter-spacing:-0.03em;}
  .gauge-score span{font-family:"Manrope",sans-serif;font-size:18px;font-weight:700;color:var(--grey);letter-spacing:0;}
  .gauge-label{font-size:12px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:var(--gold-deep);margin-top:8px;}
  .maturity-badge{margin-top:12px;padding:8px 16px;border-radius:999px;font-size:13px;font-weight:700;text-align:center;}

  .tier-card{margin:18px 0 22px;border:1.5px solid var(--line);border-radius:14px;padding:18px 20px;background:var(--panel);}
  .tier-card .tier-eyebrow{font-size:11px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--gold-deep);}
  .tier-card h3{margin:4px 0 8px;font-family:"Fraunces",Georgia,serif;font-weight:400;color:var(--navy);font-size:20px;}
  .tier-card p{margin:0;font-size:14px;color:#2B3345;line-height:1.55;}

  .plan-callout{margin:0 0 22px;border-radius:14px;padding:20px;background:var(--navy);}
  .plan-callout .tier-eyebrow{font-size:11px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--gold);}
  .plan-callout h3{margin:4px 0 8px;font-family:"Fraunces",Georgia,serif;font-weight:400;color:#fff;font-size:22px;}
  .plan-callout p{margin:0;font-size:14px;color:#C7CFE6;line-height:1.55;}

  .domain-bar-row{margin-bottom:14px;}
  .domain-bar-head{display:flex;justify-content:space-between;gap:12px;font-size:13.5px;font-weight:700;color:var(--navy);margin-bottom:6px;}
  .domain-bar-head .pct{color:var(--grey);font-weight:700;}
  .bar-track{height:9px;background:var(--line);border-radius:6px;overflow:hidden;}
  .bar-fill{height:100%;border-radius:6px;}

  .priority-box{border-left:4px solid var(--danger);background:#FBEEEC;padding:14px 16px;border-radius:6px;margin:18px 0;}
  .priority-box .p-label{font-size:11.5px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--danger);margin-bottom:6px;}
  .priority-box ol{margin:0;padding-left:18px;}
  .priority-box li{font-size:13.5px;color:#3a1f1c;line-height:1.5;margin-bottom:4px;}

  .submit-status{font-size:13px;font-weight:600;text-align:center;border-radius:10px;padding:11px 14px;margin:6px 0 4px;}
  .submit-status.sending{background:#EEF1F8;color:var(--navy);}
  .submit-status.sent{background:#E4F3EA;color:var(--ok);}
  .submit-status.failed{background:#FBEEEC;color:var(--danger);}

  .footer-actions{display:flex;flex-direction:column;gap:10px;margin-top:24px;}
  .footer-actions a{text-align:center;text-decoration:none;}
  .disclaimer{font-size:12px;color:var(--grey);text-align:center;margin-top:18px;line-height:1.5;}
  .section-label{font-family:"Fraunces",Georgia,serif;font-weight:400;color:var(--navy);font-size:20px;margin:26px 0 12px;}

  @media (max-width:420px){ .hdr h1{font-size:22px;} .gauge-score{font-size:52px;} .q-text{font-size:18px;} }
</style>
</head>
<body>
<div class="app" id="app"></div>

<script>
/* ===================== CONTENT — loaded per access token =====================
   The assessment is a paid tool. The server only returns the departments this
   token was granted: all 22 for a Comprehensive Assessment, or the individual
   departments bought as Focused Assessments. */
let TOKEN;
let ACCESS;          // { scope: "comprehensive" | "focused", email, facility }
let DEPARTMENTS;
let CATEGORIES;
let SCALE_OPTIONS;
let MATURITY_TIERS;

function maturityTierFor(score){
  const s = Math.max(0, Math.min(100, Math.round(score)));
  return MATURITY_TIERS.find(t => s >= t.min && s <= t.max) || MATURITY_TIERS[0];
}

function stageColor(stage){
  if(stage === "Critical") return "#C0392B";
  if(stage === "Basic") return "#B47B00";
  if(stage === "Fairly Functional") return "#9A7B12";
  if(stage === "Structured") return "#4C8C4A";
  return "#1E8E5A"; // Excellent
}

/* ===================== ASSESSMENTS =====================
   An assessment is either "comprehensive" (every department, one overall
   score) or a single department's key (a focused assessment, scored alone). */
function deptKeysFor(assessment){
  return assessment === "comprehensive" ? DEPARTMENTS.map(d => d.key) : [assessment];
}
function assessmentTitle(assessment){
  return assessment === "comprehensive"
    ? "Comprehensive Assessment"
    : DEPARTMENTS.find(d => d.key === assessment).name;
}
function questionCount(assessment){
  return deptKeysFor(assessment).reduce((n, k) => n + DEPARTMENTS.find(d => d.key === k).questions.length, 0);
}

/* ===================== SAVE & RESUME (per assessment, per access link) ===================== */
function saveKey(assessment){ return "seamflow_assessment_v2_" + TOKEN.slice(0, 12) + "_" + assessment; }
const PROFILE_KEY = () => "seamflow_assessment_v2_" + TOKEN.slice(0, 12) + "__profile";

function saveProgress(){
  try{
    localStorage.setItem(saveKey(state.assessment), JSON.stringify({
      qIndex: state.qIndex, answers: state.answers, savedAt: Date.now()
    }));
  }catch(e){ /* storage unavailable — fail silently */ }
}
function loadProgress(assessment){
  try{
    const parsed = JSON.parse(localStorage.getItem(saveKey(assessment)));
    return parsed && parsed.answers ? parsed : null;
  }catch(e){ return null; }
}
function markSubmitted(assessment){
  try{ localStorage.setItem(saveKey(assessment), JSON.stringify({ submittedAt: Date.now() })); }catch(e){ /* ignore */ }
}
function submittedAt(assessment){
  try{
    const parsed = JSON.parse(localStorage.getItem(saveKey(assessment)));
    return parsed && parsed.submittedAt ? parsed.submittedAt : null;
  }catch(e){ return null; }
}
function clearProgress(assessment){
  try{ localStorage.removeItem(saveKey(assessment)); }catch(e){ /* ignore */ }
}
function saveProfile(){
  try{ localStorage.setItem(PROFILE_KEY(), JSON.stringify({ facility: state.facility, role: state.role })); }catch(e){ /* ignore */ }
}
function loadProfile(){
  try{ return JSON.parse(localStorage.getItem(PROFILE_KEY())) || {}; }catch(e){ return {}; }
}

function timeAgo(ts){
  const mins = Math.round((Date.now()-ts)/60000);
  if(mins < 1) return "just now";
  if(mins < 60) return mins + " min ago";
  const hrs = Math.round(mins/60);
  if(hrs < 24) return hrs + " hr" + (hrs>1?"s":"") + " ago";
  const days = Math.round(hrs/24);
  return days + " day" + (days>1?"s":"") + " ago";
}

/* ===================== STATE ===================== */
let state = {
  screen:"home", // locked | home | question | results
  facility:"", role:"",
  assessment: null,
  flat: [],
  qIndex: 0,
  answers: {},
  submitStatus: "idle" // idle | sending | sent | failed
};

/* ===================== SUBMIT COMPLETED ASSESSMENT ===================== */
// Sends the finished assessment to /api/submit-audit, which re-checks the
// access token and scores the answers server-side (see admin.html for where
// submissions are read back). Progress is kept on this device until the
// server confirms it has the submission.
function submitAssessment(){
  if(state.submitStatus === "sending" || state.submitStatus === "sent") return;
  state.submitStatus = "sending";
  const assessment = state.assessment;
  fetch("/api/submit-audit", {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({
      token: TOKEN,
      assessment,
      facility: state.facility,
      role: state.role,
      answers: state.answers
    })
  }).then(res => {
    if(!res.ok) throw new Error("submit failed");
    state.submitStatus = "sent";
    markSubmitted(assessment);
  }).catch(() => {
    state.submitStatus = "failed";
  }).finally(() => {
    if(state.screen === "results" && state.assessment === assessment) render();
  });
}

function buildFlatQuestions(){
  const list = [];
  deptKeysFor(state.assessment).forEach(k => {
    const d = DEPARTMENTS.find(x => x.key === k);
    d.questions.forEach((q, qi) => list.push({deptKey:d.key, deptName:d.name, qi, text:q}));
  });
  state.flat = list;
}

/* ===================== RENDER ===================== */
function render(){
  const app = document.getElementById("app");
  if(state.screen === "locked") app.innerHTML = renderLocked();
  else if(state.screen === "home") app.innerHTML = renderHome();
  else if(state.screen === "question") app.innerHTML = renderQuestion();
  else app.innerHTML = renderResults();
  attachHandlers();
}

function esc(s){
  return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function header(title, sub){
  return `
  <div class="hdr">
    <a class="back" href="../index.html">&larr; seamflowconsulting.com.ng</a>
    <img class="logo-img" src="../assets/logo.png" alt="SeamFlow Consulting — Clarity. Structure. Growth.">
    <h1>${title}</h1>
    ${sub ? `<p>${sub}</p>` : ""}
  </div>`;
}

function renderLocked(){
  return `
  ${header("Business Systems Assessment", "Available to SeamFlow clients with an access link.")}
  <div class="intro">
    <div class="plan-callout">
      <div class="tier-eyebrow">Access required</div>
      <h3>This assessment opens from your personal access link</h3>
      <p>Once your Focused or Comprehensive Assessment is booked and payment is confirmed, SeamFlow Consulting sends an access link to your email. Open that link to begin.</p>
    </div>
    <p>If you already have a link and it is not working, reply to the email it came in and we will issue a new one.</p>
    <div class="footer-actions">
      <a class="btn btn-primary" href="../contact.html?interest=assessment">Book Your Assessment</a>
      <a class="btn btn-ghost" href="../services.html#clarity">See Assessment Options</a>
    </div>
  </div>`;
}

function assessmentCard(assessment, featured){
  const total = questionCount(assessment);
  const saved = loadProgress(assessment);
  const done = submittedAt(assessment);
  let meta, action;
  if(done){
    meta = `Submitted ${timeAgo(done)}`;
    action = "Submitted ✓";
  } else if(saved){
    meta = `In progress — question ${Math.min(saved.qIndex+1, total)} of ${total}, saved ${timeAgo(saved.savedAt)}`;
    action = "Resume";
  } else {
    meta = assessment === "comprehensive"
      ? `${DEPARTMENTS.length} departments · ${total} questions`
      : `Focused Assessment · ${total} questions`;
    action = "Start";
  }
  return `
    <button class="assess-card ${featured?'featured':''} ${done?'done':''}" data-assessment="${assessment}">
      <span><h4>${esc(assessmentTitle(assessment))}</h4><p>${meta}</p></span>
      <span class="go">${action}</span>
    </button>`;
}

function renderHome(){
  const comprehensive = ACCESS.scope === "comprehensive";
  const list = comprehensive
    ? assessmentCard("comprehensive", true)
    : CATEGORIES.map(c => `
        <div class="cat-label">${esc(c.title)}</div>
        ${c.deptKeys.map(k => assessmentCard(k, false)).join("")}`).join("");
  const count = DEPARTMENTS.length;

  return `
  ${header("Business Systems Assessment", "Access issued to " + esc(ACCESS.email))}
  <div class="intro">
    <h2>Before you start</h2>
    <p>${comprehensive
      ? `Your Comprehensive Assessment covers all ${count} operational departments, with 12 standardized questions each.`
      : `Your access includes ${count} Focused Assessment${count>1?"s":""} — one per department, 12 standardized questions each. Each is taken and scored on its own.`}
      Answer based on how things actually run today, not how you would like them to run. Your progress is saved on this device, so you can stop and continue later.</p>
    <div class="field-row">
      <div class="field">
        <label for="facilityInput">Organization / facility name</label>
        <input type="text" id="facilityInput" placeholder="e.g. Grace Specialist Hospital" value="${esc(state.facility)}">
      </div>
      <div class="field">
        <label for="roleInput">Your role</label>
        <select id="roleInput">
          <option value="">Select one</option>
          ${["Owner / Medical Director","Facility Administrator","Matron / Head of Nursing","Operations Manager","Other"]
            .map(r => `<option ${state.role===r?'selected':''}>${r}</option>`).join("")}
        </select>
      </div>
    </div>
    <h2>${comprehensive ? "Your assessment" : "Your assessments"}</h2>
    ${list}
  </div>`;
}

function renderQuestion(){
  const q = state.flat[state.qIndex];
  const total = state.flat.length;
  const pct = Math.round((state.qIndex/total)*100);
  const selected = state.answers[q.deptKey+"_"+q.qi];
  const dept = DEPARTMENTS.find(d=>d.key===q.deptKey);

  return `
  ${header(esc(assessmentTitle(state.assessment)), state.assessment === "comprehensive" ? "" : "Focused Assessment")}
  <div class="progress-wrap">
    <div class="progress-track"><div class="progress-fill" style="width:${pct}%;"></div></div>
    <div class="progress-label"><span>Question ${state.qIndex+1} of ${total}</span><span>${pct}% complete</span></div>
  </div>
  <div class="panel">
    <div class="domain-tag">${esc(dept.name)} — ${q.qi+1}/${dept.questions.length}</div>
    <div class="question">
      <div class="q-text">${esc(q.text)}</div>
      <div class="scale">
        ${SCALE_OPTIONS.map(o => `
          <label class="opt ${selected===o.v?'selected':''}" data-val="${o.v}">
            <input type="radio" name="opt" value="${o.v}" ${selected===o.v?'checked':''}>
            <span class="dot"></span>
            <span class="opt-text">${esc(o.t)}</span>
          </label>`).join("")}
      </div>
    </div>
  </div>
  <div class="nav-row">
    <button class="btn btn-ghost" id="backBtn" ${state.qIndex===0?'disabled':''}>Back</button>
    <button class="btn btn-primary" id="nextBtn" ${selected?'':'disabled'}>${state.qIndex===total-1?'Submit &amp; See Results':'Next'}</button>
  </div>
  <div style="text-align:center;margin-top:16px;">
    <button class="link-btn" id="saveExitBtn">Save &amp; continue later</button>
  </div>`;
}

function scoreDept(deptKey){
  const dept = DEPARTMENTS.find(d=>d.key===deptKey);
  let total=0;
  dept.questions.forEach((q,qi)=>{ total += (state.answers[deptKey+"_"+qi] || 0); });
  return Math.round((total/(dept.questions.length*5))*100);
}

function overallScore(){
  const scores = deptKeysFor(state.assessment).map(scoreDept);
  return Math.round(scores.reduce((a,b)=>a+b,0)/scores.length);
}

function nextStepCopy(deptScores){
  const below70 = deptScores.filter(d => d.score < 70);
  if(deptScores.length === 1){
    return below70.length
      ? "This department scored below the 70% operational health threshold. It is a candidate for Structure — designing or redesigning the systems, processes, SOPs and controls needed to close the gaps identified here."
      : "This department scored at or above the 70% operational health threshold — a strong baseline to sustain and build on.";
  }
  if(below70.length === 0){
    return "Every department scored at or above the 70% operational health threshold — a strong baseline. The next conversation is about Growth: building on what is already working.";
  }
  const names = below70.map(d => d.name);
  const list = names.length === 1 ? names[0] : names.slice(0,-1).join(", ") + ", and " + names[names.length-1];
  return "Departments scoring below the 70% operational health threshold are candidates for Structure — designing or redesigning the systems, processes, SOPs and controls required. On this assessment that applies to "
    + below70.length + " of " + deptScores.length + " departments: " + list + ".";
}

function barColor(score){ if(score<40) return "#C0392B"; if(score<70) return "#F5A800"; return "#1E8E5A"; }

function submitStatusBlock(){
  if(state.submitStatus === "sent") return `<div class="submit-status sent">Your responses have been submitted to SeamFlow Consulting.</div>`;
  if(state.submitStatus === "failed") return `<div class="submit-status failed">We could not submit your responses. Check your connection and <button class="link-btn" id="retrySubmitBtn" style="color:inherit;font-weight:800;padding:0;">try again</button>. Your answers are saved on this device.</div>`;
  return `<div class="submit-status sending">Submitting your responses…</div>`;
}

function renderResults(){
  const focused = state.assessment !== "comprehensive";
  const deptScores = deptKeysFor(state.assessment).map(k=>{
    const d = DEPARTMENTS.find(x=>x.key===k);
    return {key:k, name:d.name, score:scoreDept(k)};
  }).sort((a,b)=>a.score-b.score);
  const overall = overallScore();
  const tier = maturityTierFor(overall);
  const tierColor = stageColor(tier.stage);

  // A focused assessment has one department, so the detail worth showing is
  // which individual statements scored lowest, not a department ranking.
  let detail;
  if(focused){
    const dept = DEPARTMENTS.find(d => d.key === state.assessment);
    const weak = dept.questions
      .map((text, qi) => ({ text, v: state.answers[dept.key+"_"+qi] }))
      .filter(q => q.v <= 2);
    detail = weak.length ? `
      <div class="priority-box">
        <div class="p-label">Key gaps identified (${weak.length})</div>
        <ol>${weak.map(q => `<li>${esc(q.text)}</li>`).join("")}</ol>
      </div>` : "";
  } else {
    detail = `
      <div class="priority-box">
        <div class="p-label">Top Priority Gaps</div>
        <ol>${deptScores.slice(0,3).map(d=>`<li><strong>${esc(d.name)}</strong> — ${d.score}/100</li>`).join("")}</ol>
      </div>
      <div class="section-label">Department-by-department findings</div>
      ${deptScores.map(d=>`
        <div class="domain-bar-row">
          <div class="domain-bar-head"><span>${esc(d.name)}</span><span class="pct">${d.score}%</span></div>
          <div class="bar-track"><div class="bar-fill" style="width:${d.score}%;background:${barColor(d.score)};"></div></div>
        </div>`).join("")}`;
  }

  const sub = (state.facility ? esc(state.facility) + " — " : "")
    + (focused ? "Focused Assessment: " + esc(assessmentTitle(state.assessment)) : DEPARTMENTS.length + " departments assessed");

  return `
  ${header("Your Assessment Results", sub)}
  <div class="results">
    <div class="gauge-wrap">
      <div class="gauge-score">${overall}<span>/100</span></div>
      <div class="gauge-label">Operational Health Score</div>
      <div class="maturity-badge" style="background:${tierColor}1F;border:1.5px solid ${tierColor};color:${tierColor};">
        ${esc(tier.label)}${tier.label === tier.stage ? "" : ` <span style="opacity:0.75;font-weight:600;">· ${esc(tier.stage)} tier</span>`}
      </div>
    </div>

    ${submitStatusBlock()}

    <div class="tier-card">
      <div class="tier-eyebrow">What this points to</div>
      <h3>${deptScores.some(d => d.score < 70) ? "Structure" : "Growth"}</h3>
      <p>${nextStepCopy(deptScores)}</p>
    </div>

    ${detail}

    <div class="footer-actions">
      <button class="btn btn-primary" id="homeBtn">Back to My Assessments</button>
      <a class="btn btn-ghost" href="../contact.html">Contact SeamFlow Consulting</a>
    </div>
    <p class="disclaimer">These are your initial scores. SeamFlow Consulting will follow up with your assessment findings and results debrief.</p>
  </div>`;
}

/* ===================== HANDLERS ===================== */
function readProfile(){
  const facilityEl = document.getElementById("facilityInput");
  if(!facilityEl) return;
  state.facility = facilityEl.value.trim();
  state.role = document.getElementById("roleInput").value;
  saveProfile();
}

function startAssessment(assessment){
  const saved = submittedAt(assessment) ? null : loadProgress(assessment);
  state.assessment = assessment;
  buildFlatQuestions();
  state.answers = saved ? saved.answers : {};
  state.qIndex = saved ? Math.min(saved.qIndex, state.flat.length-1) : 0;
  state.submitStatus = "idle";
  state.screen = "question";
  render(); window.scrollTo(0,0);
}

function attachHandlers(){
  if(state.screen==="home"){
    document.getElementById("facilityInput").onchange = readProfile;
    document.getElementById("roleInput").onchange = readProfile;
    document.querySelectorAll(".assess-card").forEach(el => {
      el.onclick = () => {
        readProfile();
        const assessment = el.getAttribute("data-assessment");
        // Retaking a submitted assessment sends a second submission, so ask first.
        if(submittedAt(assessment) && !el.dataset.confirm){
          el.dataset.confirm = "1";
          el.querySelector(".go").textContent = "Retake?";
          el.querySelector("p").textContent = "Already submitted. Click again to retake and submit a new set of answers.";
          return;
        }
        if(submittedAt(assessment)) clearProgress(assessment);
        startAssessment(assessment);
      };
    });
  } else if(state.screen==="question"){
    document.querySelectorAll(".opt").forEach(el=>{
      el.onclick = (e) => {
        e.preventDefault();
        const q = state.flat[state.qIndex];
        state.answers[q.deptKey+"_"+q.qi] = parseInt(el.getAttribute("data-val"),10);
        saveProgress();
        render();
      };
    });
    document.getElementById("backBtn").onclick = () => {
      if(state.qIndex>0){ state.qIndex--; saveProgress(); render(); window.scrollTo(0,0); }
    };
    document.getElementById("nextBtn").onclick = () => {
      if(state.qIndex < state.flat.length-1){ state.qIndex++; saveProgress(); render(); window.scrollTo(0,0); }
      else { saveProgress(); state.screen="results"; submitAssessment(); render(); window.scrollTo(0,0); }
    };
    document.getElementById("saveExitBtn").onclick = () => {
      saveProgress();
      state.screen = "home";
      render(); window.scrollTo(0,0);
    };
  } else if(state.screen==="results"){
    document.getElementById("homeBtn").onclick = () => {
      state.screen = "home";
      render(); window.scrollTo(0,0);
    };
    const retryBtn = document.getElementById("retrySubmitBtn");
    if(retryBtn) retryBtn.onclick = () => { submitAssessment(); render(); };
  }
}

/* ===================== LOAD CONTENT — requires a paid access token ===================== */
(async function(){
  const params = new URLSearchParams(location.search);
  const token = params.get("token");
  if(!token){ state.screen = "locked"; render(); return; }
  try {
    const contentResponse = await fetch(`/api/get-tool-content?token=${encodeURIComponent(token)}&plan=clarity`);
    if(contentResponse.status === 403 || contentResponse.status === 400){ state.screen = "locked"; render(); return; }
    if(!contentResponse.ok) throw new Error("content unavailable");
    ({ ACCESS, DEPARTMENTS, SCALE_OPTIONS, MATURITY_TIERS, CATEGORIES } = await contentResponse.json());
    TOKEN = token;
    const profile = loadProfile();
    state.facility = profile.facility || ACCESS.facility || "";
    state.role = profile.role || "";
    render();
  } catch (error) {
    document.getElementById("app").innerHTML = '<div class="intro"><p>Something went wrong loading the assessment. Please refresh the page or try again shortly.</p></div>';
  }
})();
</script>
